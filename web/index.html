<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚨</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RoadWatch Live Radar | City Pothole & Road Quality Map</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <!-- Google Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-950 text-slate-100 overflow-hidden font-sans antialiased">
    <script>
      window.addEventListener('error', function(e) {
        console.error('GLOBAL RUNTIME ERROR:', e);
        var errDiv = document.getElementById('debug-error-box');
        if (!errDiv) {
          errDiv = document.createElement('div');
          errDiv.id = 'debug-error-box';
          errDiv.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#991B1B;color:#FFF;padding:16px;z-index:999999;font-family:monospace;font-size:13px;white-space:pre-wrap;box-shadow:0 10px 30px rgba(0,0,0,0.5);';
          document.body.prepend(errDiv);
        }
        errDiv.textContent = 'APPLICATION ERROR:\n' + (e.message || e.error) + '\n\nSource: ' + e.filename + ':' + e.lineno + '\n\n' + (e.error ? e.error.stack : '');
      });
      window.addEventListener('unhandledrejection', function(e) {
        console.error('UNHANDLED PROMISE REJECTION:', e.reason);
      });
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
